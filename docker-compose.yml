version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    container_name: postgres_container
    ports:
      - '5432:5432'
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodejs2024q3
    volumes:
      - pg_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nodejs_app
    ports:
      - '3000:3000'
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: 'postgres://postgres:postgres@postgres:5432/nodejs2024q3'
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  pg_data:
